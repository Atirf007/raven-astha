<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Biblioteca 3D ASTHA · Verificação</title><style>body{margin:0;padding:30px;background:#edf0f4;color:#243448;font:14px Arial}h1{margin:0 0 8px}#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}article{background:white;border:1px solid #d8e0eb;border-radius:16px;padding:12px}canvas{display:block;width:100%}h2{font-size:15px;margin:8px}p{margin:8px;color:#576a83}</style><h1>Biblioteca 3D ASTHA</h1><p>Modelos procedurais · prévia de verificação</p><p id="result">Verificando…</p><div id="gallery"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../../app/js/sistema-object-library.js?v=1"></script><script>
let checked=0;for(const [key,def] of Object.entries(ASTHAObjectLibrary.catalog)){
const card=document.createElement('article'),scene=new THREE.Scene();scene.background=new THREE.Color('#f8fafc');const object=ASTHAObjectLibrary.create(key,def.w,def.height,def.d);scene.add(object);object.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(object),size=bounds.getSize(new THREE.Vector3());if(Math.abs(size.x-def.w)>.01||Math.abs(size.y-def.height)>.01||Math.abs(size.z-def.d)>.01||Math.abs(bounds.min.y)>.01)throw Error('Dimensões incorretas: '+key);checked++;
scene.add(new THREE.HemisphereLight(0xffffff,0x7a8a9e,1.2));const light=new THREE.DirectionalLight(0xffffff,.9);light.position.set(200,400,300);scene.add(light);const max=Math.max(def.w,def.height,def.d);const camera=new THREE.PerspectiveCamera(35,1.5,.1,5000);camera.position.set(max*1.7,max*1.35,max*1.9);camera.lookAt(0,def.height*.45,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(360,240);renderer.setPixelRatio(1);renderer.render(scene,camera);const title=document.createElement('h2');title.textContent=def.name;const detail=document.createElement('p');detail.textContent=def.w+' × '+def.d+' × '+def.height+' cm';card.append(renderer.domElement,title,detail);document.getElementById('gallery').append(card);
}document.getElementById('result').textContent=checked+' / 9 modelos: dimensões e apoio no piso verificados.';
</script></html>
