<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>ASTHA · verificação da biblioteca industrial</title><link rel="stylesheet" href="../../app/css/industrial-library.css?v=20261008e"><style>body{margin:0;background:#f6f8fa;color:#182230;font:14px Arial}header.main{padding:20px;background:#182434;color:#fff}#cad-group-addons{display:flex;padding:12px;gap:12px;background:white}#cadWorkspace{display:flex;height:720px}#gallery{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;gap:12px;padding:20px}article{background:white;padding:12px;border:1px solid #dce3ea;border-radius:6px}article img{width:100%}h2{font-size:13px}small{color:#64748b}#result{padding:0 20px}</style><header class="main">ASTHA / BIBLIOTECA INDUSTRIAL · Verificação dos modelos</header><button id="verifyParameters">Verificar parâmetros e LOD</button><button id="benchmark">Medir cenas 25 / 250 / 1200</button><pre id="measurements" role="status"></pre><p id="result">Verificando geometria…</p><div id="cad-group-addons"><div></div><div>Biblioteca 3D</div></div><div id="cadWorkspace"><div id="gallery"></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="../../app/js/sistema-industrial-catalog.js?v=20261008e"></script><script src="../../app/js/sistema-industrial-generators.js?v=20261008e"></script><script src="../../app/js/sistema-object-library.js?v=20261008e"></script><script src="../../app/js/sistema-industrial-library-ui.js?v=20261008e"></script><script>
window.setCadTool=tool=>document.getElementById('result').textContent='Ferramenta selecionada: '+tool;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(300,210);let checked=0;
for(const [key,def] of Object.entries(ASTHAObjectLibrary.catalog)){
 for(const factor of [1,.7,1.4]){const object=ASTHAObjectLibrary.create(key,def.w*factor,def.height*factor,def.d*factor);object.updateMatrixWorld(true);const bounds=new THREE.Box3().setFromObject(object),size=bounds.getSize(new THREE.Vector3());if(Math.abs(size.x-def.w*factor)>.01||Math.abs(size.y-def.height*factor)>.01||Math.abs(size.z-def.d*factor)>.01||Math.abs(bounds.min.y)>.01)throw Error('Dimensões incorretas: '+key);object.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});}checked++;
 if(!def.id.startsWith('ASTHA-3D-'))continue;
 const scene=new THREE.Scene();scene.background=new THREE.Color('#f6f8fa');scene.add(ASTHAObjectLibrary.create(key,def.w,def.height,def.d));scene.add(new THREE.HemisphereLight(0xffffff,0x64748b,1.2));const light=new THREE.DirectionalLight(0xffffff,.9);light.position.set(200,400,300);scene.add(light);const max=Math.max(def.w,def.height,def.d),camera=new THREE.PerspectiveCamera(35,300/210,.1,max*20);camera.position.set(max*1.8,max*1.4,max*2);camera.lookAt(0,def.height*.45,0);renderer.render(scene,camera);const card=document.createElement('article'),image=document.createElement('img');image.src=renderer.domElement.toDataURL();const title=document.createElement('h2');title.textContent=def.name;const label=document.createElement('small');label.textContent=def.id+' · '+[def.w/100,def.d/100,def.height/100].join(' × ')+' m';card.append(image,title,label);document.getElementById('gallery').append(card);scene.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});
}renderer.dispose();document.getElementById('result').textContent=checked+' modelos verificados em 3 escalas · 248 novos · 9 existentes · apoio no piso e medidas corretos.';
</script><script src="industrial-browser-checks.js?v=20261008f"></script></html>
