<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login — EVAH OPHIM">
  <title>Login — EVAH OPHIM</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="shorcut icon" type="imagex/png" href="../images/Evhaophim1 (2).png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="form-container animate-fade-in-up">
        <div class="form-header">
          <a href="../index.html" class="logo-link"><img src="../images/Logotipo (Alpha).png" alt="EVAH OPHIM" style="height: 32px; object-fit: contain; "></a>
          <!-- [TEXTO] Título do login -->
          <h1>Bem-vindo de volta</h1>
          <p>Entre na sua conta para continuar</p>
        </div>

        <form class="form" id="loginForm" novalidate>
          <div class="input-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="input" placeholder="seu@email.com" required autocomplete="email">
            <span class="input-error" id="loginEmailError"></span>
          </div>

          <div class="input-group">
            <label for="loginPassword">Senha</label>
            <input type="password" id="loginPassword" class="input" placeholder="••••••••" required autocomplete="current-password">
            <span class="input-error" id="loginPasswordError"></span>
          </div>

          <div class="form-link-row">
            <label class="checkbox-group">
              <input type="checkbox" id="rememberMe">
              <span>Lembrar-me</span>
            </label>
            <!-- [LINK] Link de recuperação de senha -->
            <a href="contact.html">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>
        </form>

        <div class="social-divider"><span>ou continue com</span></div>
        <div class="social-buttons">
          <!-- [LINK] Login social — configure as integrações -->
          <button class="social-btn" id="googleLogin">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <!-- [LINK] Login com Microsoft (Entra ID) — configure clientId em azure.js -->
          <button class="social-btn" id="microsoftLogin">
            <svg viewBox="0 0 24 24" width="18" height="18"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="13" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="13" width="10" height="10" fill="#00A4EF"/><rect x="13" y="13" width="10" height="10" fill="#FFB900"/></svg>
            Microsoft
          </button>
          <!-- [LINK] Login por digital/PIN (Windows Hello) via WebAuthn -->
          <button class="social-btn" id="webauthnLogin" onclick="webAuthnLogin()" style="border-color:rgba(0,212,255,0.3)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#00D4FF" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="16" r="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            Digital / PIN
          </button>
        </div>

        <div class="form-footer">
          Não tem conta? <a href="register.html">Criar conta grátis</a>
        </div>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-right-content">
        <h2>EVAH OPHIM</h2>
        <p>Gestão inteligente de estoque e materiais industriais com tecnologia de ponta.</p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="../js/security.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
