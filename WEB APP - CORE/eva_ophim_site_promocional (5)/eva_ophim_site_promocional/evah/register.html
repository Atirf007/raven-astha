<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Criar Conta — EVAH OPHIM">
  <title>Criar Conta — EVAH OPHIM</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="shorcut icon" type="imagex/png" href="../images/Evhaophim1 (2).png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-left">
      <div class="form-container animate-fade-in-up">
        <div class="form-header">
          <a href="../index.html" class="logo-link"><img src="../images/Logotipo (Alpha).png" alt="EVAH OPHIM" style="height: 32px; object-fit: contain; "></a>
          <h1>Crie sua conta</h1>
          <p>Comece a usar o EVAH OPHIM gratuitamente</p>
        </div>

        <!-- Multi-step progress -->
        <div class="step-progress" id="stepProgress">
          <div class="step-dot active" data-step="1"></div>
          <div class="step-line"></div>
          <div class="step-dot" data-step="2"></div>
          <div class="step-line"></div>
          <div class="step-dot" data-step="3"></div>
        </div>

        <form class="form" id="registerForm" novalidate>
          <!-- Step 1: Dados pessoais -->
          <div class="form-step active" id="step1">
            <div class="form-row">
              <div class="input-group">
                <label for="regName">Nome</label>
                <input type="text" id="regName" class="input" placeholder="Seu nome" required>
                <span class="input-error" id="regNameError"></span>
              </div>
              <div class="input-group">
                <label for="regSurname">Sobrenome</label>
                <input type="text" id="regSurname" class="input" placeholder="Seu sobrenome" required>
              </div>
            </div>
            <div class="input-group">
              <label for="regEmail">Email corporativo</label>
              <input type="email" id="regEmail" class="input" placeholder="seu@empresa.com" required autocomplete="email">
              <span class="input-error" id="regEmailError"></span>
            </div>
            <button type="button" class="btn btn-primary btn-block btn-lg" onclick="nextStep(2)">Continuar →</button>
          </div>

          <!-- Step 2: Senha -->
          <div class="form-step" id="step2" style="display:none">
            <div class="input-group">
              <label for="regPassword">Senha</label>
              <input type="password" id="regPassword" class="input" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
              <div class="password-strength" id="passwordStrength">
                <div class="password-strength-bar"></div>
                <div class="password-strength-bar"></div>
                <div class="password-strength-bar"></div>
                <div class="password-strength-bar"></div>
              </div>
              <span class="password-strength-text" id="passwordStrengthText"></span>
            </div>
            <div class="input-group">
              <label for="regPasswordConfirm">Confirmar senha</label>
              <input type="password" id="regPasswordConfirm" class="input" placeholder="Repita sua senha" required>
              <span class="input-error" id="regPasswordConfirmError"></span>
            </div>
            <div class="flex gap-3">
              <button type="button" class="btn btn-secondary btn-block" onclick="prevStep(1)">← Voltar</button>
              <button type="button" class="btn btn-primary btn-block" onclick="nextStep(3)">Continuar →</button>
            </div>
          </div>

          <!-- Step 3: Empresa + Termos -->
          <div class="form-step" id="step3" style="display:none">
            <div class="input-group">
              <label for="regCompany">Empresa</label>
              <input type="text" id="regCompany" class="input" placeholder="Nome da empresa">
            </div>
            <div class="input-group">
              <label for="regPhone">Telefone</label>
              <input type="tel" id="regPhone" class="input" placeholder="+55 (XX) XXXXX-XXXX">
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="regTerms" required>
              <label for="regTerms">Li e aceito os <a href="termos.html" target="_blank">Termos de Uso</a> e <a href="privacidade.html" target="_blank">Política de Privacidade</a></label>
            </div>
            <div class="flex gap-3">
              <button type="button" class="btn btn-secondary btn-block" onclick="prevStep(2)">← Voltar</button>
              <button type="submit" class="btn btn-primary btn-block btn-lg">Criar Conta</button>
            </div>
          </div>
        </form>

        <div class="social-divider"><span>ou cadastre com</span></div>
        <div class="social-buttons">
          <button class="social-btn" id="googleRegister">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
          <button class="social-btn" id="microsoftRegister">
            <svg viewBox="0 0 24 24" width="18" height="18"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="13" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="13" width="10" height="10" fill="#00A4EF"/><rect x="13" y="13" width="10" height="10" fill="#FFB900"/></svg>
            Microsoft
          </button>
        </div>

        <div class="form-footer">
          Já tem conta? <a href="login.html">Fazer login</a>
        </div>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-right-content">
        <h2>Comece Agora</h2>
        <p>Cadastre-se e tenha acesso imediato à plataforma mais moderna do mercado.</p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="../js/security.js"></script>
  <script src="../js/forms.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
