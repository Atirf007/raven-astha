<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <!-- [IMAGEM] Logo EVAH OPHIM — SVG baseado na identidade visual -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
  </defs>
  <!-- EVAH -->
  <text x="10" y="55" font-family="'Outfit', sans-serif" font-weight="800" font-size="48" fill="url(#logoGrad)" letter-spacing="6">EVAH</text>
  <!-- OPHIM -->
  <text x="195" y="55" font-family="'Outfit', sans-serif" font-weight="800" font-size="48" fill="currentColor" letter-spacing="6">OPHIM</text>
</svg>
