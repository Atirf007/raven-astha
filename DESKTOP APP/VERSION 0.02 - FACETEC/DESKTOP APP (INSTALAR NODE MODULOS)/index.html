<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTAH RAVEN V1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #080810;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
      color: #94a3b8;
    }
    .loader { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 13px; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Carregando...</p>
  </div>
  <script>
    const token = localStorage.getItem('evah_token');
    if (token) {
      window.location.replace('/app/home.html');
    } else {
      window.location.replace('/app/login.html');
    }
  </script>
</body>
</html>
